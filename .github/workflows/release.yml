name: Release

# Push a v* tag and it builds Windows and Linux, then publishes the tag as a
# release. v<version>-cheats<n> (v1.3.1-cheats1) publishes as a full release;
# any other suffix (v1.3.1-rc1) as a prerelease. There is no update server:
# upstream's manifest and R2 upload steps are removed, so builds never offer
# to "update" to official re:Blue.
# workflow_dispatch builds the same jobs without publishing.
#
# macOS is off, here and in the nightly. _build-macos.yml stays put: turning it
# back on is this job block and one entry in publish's needs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "rexglue-sdk release: latest-nightly, latest-stable, or an explicit tag"
        required: false
        type: string
        default: v0.10.1

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    uses: ./.github/workflows/_resolve.yml
    with:
      sdk_ref: ${{ inputs.sdk_ref || 'v0.10.1' }}
      asset_tag: -cheats
    secrets: inherit

  verify:
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Match the tag against the project version
        id: tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          case "${TAG}" in
            "v${VERSION}-cheats"*) echo "prerelease=false" >> "${GITHUB_OUTPUT}" ;;
            "v${VERSION}-"*)       echo "prerelease=true"  >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error::tag ${TAG} does not match project version ${VERSION}; expected v${VERSION}-cheats<n> (release) or v${VERSION}-<suffix> (prerelease)"
              exit 1
              ;;
          esac

  windows:
    needs: [resolve, verify]
    uses: ./.github/workflows/_build-windows.yml
    with:
      sdk_tag: ${{ needs.resolve.outputs.sdk_tag }}
      asset_base: ${{ needs.resolve.outputs.asset_base }}
      update_channel: ${{ needs.verify.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
    secrets: inherit

  linux:
    needs: [resolve, verify]
    uses: ./.github/workflows/_build-linux.yml
    with:
      sdk_tag: ${{ needs.resolve.outputs.sdk_tag }}
      asset_base: ${{ needs.resolve.outputs.asset_base }}
      update_channel: ${{ needs.verify.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
    secrets: inherit

  publish:
    needs: [resolve, verify, windows, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: reblue-*
          path: artifacts
          merge-multiple: true

      # Not into artifacts/: that is what the manifest names and what goes to
      # the CDN. Symbols only attach to the release.
      - name: Download symbols
        uses: actions/download-artifact@v8
        with:
          pattern: symbols-*
          path: symbols
          merge-multiple: true

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/compose-release-notes.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: reblue v${{ needs.resolve.outputs.version }} with cheats (${{ github.ref_name }})
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          body_path: notes.md
          files: |
            artifacts/*
            symbols/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

